<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191510"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect x="24" y="20" width="592" height="360" rx="18" fill="#14110d" stroke="#2b241c"/>
  <rect x="24" y="20" width="592" height="44" rx="18" fill="#191510"/>
  <rect x="24" y="46" width="592" height="18" fill="#191510"/>
  <circle cx="46" cy="42" r="5" fill="#3a322a"/>
  <circle cx="62" cy="42" r="5" fill="#3a322a"/>
  <circle cx="78" cy="42" r="5" fill="#3a322a"/>
  <text x="320" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#c9bda9">Auto-Replier · Ответы по триггерам</text>

  <text x="56" y="98" font-size="12" fill="#8a8073">Правила</text>
  <rect x="56" y="110" width="528" height="56" rx="12" fill="#241c13"/>
  <rect x="76" y="124" width="100" height="28" rx="8" fill="#2b5278"/>
  <text x="126" y="143" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8d8f0">триггер</text>
  <text x="196" y="136" font-size="12.5" fill="#c9bda9">слова: «привет», «ку»</text>
  <text x="196" y="154" font-size="12" fill="#8a8073">→ «Привет! Чем помочь?»</text>

  <rect x="56" y="176" width="528" height="56" rx="12" fill="#241c13"/>
  <rect x="76" y="190" width="100" height="28" rx="8" fill="#3a322a"/>
  <text x="126" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c9bda9">группа</text>
  <text x="196" y="202" font-size="12.5" fill="#c9bda9">в группе «Работа»</text>
  <text x="196" y="220" font-size="12" fill="#8a8073">→ ответ с цитатой сообщения</text>

  <text x="56" y="268" font-size="12" fill="#8a8073">Процесс ответа</text>
  <rect x="56" y="280" width="528" height="60" rx="14" fill="#181408" stroke="#2b241c"/>
  <circle cx="96" cy="310" r="14" fill="#2b5278"/>
  <text x="96" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#a8d8f0">1</text>
  <text x="124" y="306" font-size="12.5" fill="#c9bda9">Сообщение с триггером</text>
  <text x="124" y="324" font-size="11" fill="#8a8073">личный чат · группа · канал</text>

  <rect x="130" y="296" width="40" height="2" rx="1" fill="#3a322a"/>
  <circle cx="206" cy="310" r="14" fill="#2b5278"/>
  <text x="206" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#a8d8f0">2</text>
  <text x="234" y="306" font-size="12.5" fill="#c9bda9">Автоответ (цитатой)</text>
  <text x="234" y="324" font-size="11" fill="#8a8073">с анти-спамом и правилами</text>

  <rect x="56" y="356" width="250" height="28" rx="14" fill="#1c2e22" stroke="#2e5740"/>
  <text x="181" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7fd39a">Анти-спам включён</text>
